<!DOCTYPE html>
<html>
<head><title>Home</title></head>
<body>
    <h2>Welcome, {{ name }} {{ surname }}!</h2>

    <h3>Log Time</h3>
    <form method="post" action="{{ url_for('home') }}">
        <label for="date">Date:</label>
        <input type="date" name="date" required><br>
    
        <label for="project">Project:</label>
        <select id="project" name="project">
            <option value="">-- Select a project --</option>
            <option value="jcr">jcr</option>
            <option value="muguets">muguets</option>
            <!-- Add more options here -->
        </select>
    

        <label for="task">Task:</label>
        <select id="task" name="task">
            <option value="">-- Select a task --</option>
        </select>
    
        <label for="hours">Hours:</label>
        <input type="number" step="0.1" name="hours" required><br>
    
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById("project").addEventListener("change", function () {
            const project = this.value;
            const taskSelect = document.getElementById("task");
            taskSelect.innerHTML = '<option value="">Loading...</option>';
        
            if (project) {
                fetch(`/tasks/${project}`)
                    .then(response => response.json())
                    .then(data => {
                        taskSelect.innerHTML = '<option value="">-- Select a task --</option>';
                        data.forEach(task => {
                            const option = document.createElement("option");
                            option.value = task;
                            option.textContent = task;
                            taskSelect.appendChild(option);
                        });
                    })
                    .catch(err => {
                        taskSelect.innerHTML = '<option value="">Failed to load tasks</option>';
                        console.error(err);
                    });
            } else {
                taskSelect.innerHTML = '<option value="">-- Select a task --</option>';
            }
        });
        </script>

    <hr>

    <h3>Choose Week to View</h3>
    <form method="get" action="{{ url_for('home') }}">
        <label for="week_start_date">Select Start Date (e.g., Monday):</label>
        <input type="date" name="week_start_date" value="{{ week_start_date }}" required>
        <button type="submit">View Week</button>
    </form>


    <h3>Week's Time Report</h3>
    <table border="1">
        <tr>
            <th>Date</th>
            <th>Project & Task</th>
            <th>Total Hours</th>
        </tr>
        {% for date, projects in weekly_projects.items() %}
            <tr>
                <td>{{ date }}</td>
                <td>
                    {% for item in projects %}
                        {{ item }}<br>
                    {% endfor %}
                </td>
                <td>{{ weekly_hours[date] }}</td>
            </tr>
        {% endfor %}
    </table>
       
    <a href="{{ url_for('logout') }}">Logout</a>    
</body>
</html>
